name: HA Analyst beta bug report / Beta-Fehlerbericht
description: Report a reproducible problem from an external HA Analyst beta installation. / Reproduzierbaren Fehler aus einer externen Beta-Installation melden.
title: "[Beta] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Testen / Thanks for testing HA Analyst.

        Bitte keine Home-Assistant-Tokens, Zigbee2MQTT-Tokens, Lizenzschlüssel, internen URLs oder persönliche Hausdaten einfügen. Verwende nach Möglichkeit das datensparsame HA-Analyst-Diagnosepaket aus **Support & Beta-Diagnose**.

        Do not paste Home Assistant credentials, Zigbee2MQTT tokens, license keys, internal URLs, or private household data. Prefer the privacy-conscious HA Analyst diagnostics package from **Support & beta diagnostics**.

  - type: input
    id: analyst_version
    attributes:
      label: HA-Analyst-Version / Beta-Build · HA Analyst version / beta build
      placeholder: "1.0.17.x / B0.1.x"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home-Assistant-Core-Version · Home Assistant Core version
      placeholder: "2026.9.x"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architektur · Architecture
      options:
        - amd64
        - aarch64
        - Unbekannt / Unknown
    validations:
      required: true

  - type: dropdown
    id: test_type
    attributes:
      label: Testart · Test type
      options:
        - Neuinstallation / Fresh install
        - Update
        - Recovery / Rollback
        - Normaler Betrieb / Normal runtime
        - Sonstiges / Other
    validations:
      required: true

  - type: dropdown
    id: restart_notice
    attributes:
      label: Bridge-Neustarthinweis · Bridge restart notice
      description: Wurde ein Home-Assistant-Neustart angefordert und ausgeführt? / Was a Home Assistant restart requested and performed?
      options:
        - Nicht angefordert / Not requested
        - Angefordert und ausgeführt / Requested and performed
        - Angefordert, noch nicht ausgeführt / Requested but not yet performed
        - Unsicher / Unsure
    validations:
      required: true

  - type: dropdown
    id: selftest
    attributes:
      label: Runtime-Selbsttest · Runtime self-test
      options:
        - PASS
        - FAIL
        - Konnte nicht ausgeführt werden / Could not run
        - Noch nicht ausgeführt / Not run yet
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Fehlerbeschreibung · Problem description
      description: Beschreibe Ist-Zustand, Erwartung und ungefähren Fehlerzeitpunkt. / Describe what happened, what you expected, and the approximate time of the failure.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduktionsschritte · Reproduction steps
      description: Kürzeste reproduzierbare Schrittfolge angeben. / List the minimum steps needed to reproduce the problem.
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnosepaket · Diagnostics package
      description: HA-Analyst-Diagnose-ZIP anhängen. Keine secret-haltigen Logs oder Konfigurationsdateien stattdessen einfügen. / Attach the HA Analyst diagnostics ZIP. Do not paste secret-bearing logs or configuration files instead.
      placeholder: Diagnose-ZIP hier ablegen / Drag the diagnostics ZIP here.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutzprüfung · Privacy check
      options:
        - label: Ich habe den Bericht auf Zugangsdaten, Tokens, Lizenzschlüssel, interne URLs, Namen und andere private Hausdaten geprüft. / I checked this report for credentials, tokens, license keys, internal URLs, names and other private household data.
          required: true
