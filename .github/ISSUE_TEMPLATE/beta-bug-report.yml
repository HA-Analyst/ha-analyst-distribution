name: HA Analyst beta bug report
description: Report a reproducible problem from an external HA Analyst beta installation.
title: "[Beta] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Testen / Thanks for testing HA Analyst.

        Bitte keine Home-Assistant-Tokens, Zigbee2MQTT-Tokens, Lizenzschlüssel, signierten Lease-Tokens, internen URLs oder persönliche Hausdaten einfügen. Verwende nach Möglichkeit das datensparsame HA-Analyst-Diagnosepaket aus **Support & Beta-Diagnose**.

        Do not paste Home Assistant credentials, Zigbee2MQTT tokens, license keys, signed lease tokens, internal URLs, or private household data. Prefer the privacy-conscious HA Analyst diagnostics package from **Support & beta diagnostics**.

  - type: input
    id: analyst_version
    attributes:
      label: HA Analyst version / Beta build
      placeholder: "1.0.17.78 / B0.1.01"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Core version
      placeholder: "2026.9.x"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
        - unknown
    validations:
      required: true

  - type: dropdown
    id: test_type
    attributes:
      label: Test type / Testart
      options:
        - Fresh install
        - Update
        - Recovery / rollback
        - Normal runtime
        - Other
    validations:
      required: true

  - type: dropdown
    id: restart_notice
    attributes:
      label: Bridge restart notice / Bridge-Neustarthinweis
      description: Was a Home Assistant restart requested by HA Analyst, and was it performed?
      options:
        - Not requested
        - Requested and performed
        - Requested but not yet performed
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: selftest
    attributes:
      label: Runtime self-test
      options:
        - PASS
        - FAIL
        - Could not run
        - Not run yet
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description / Fehlerbeschreibung
      description: Describe what happened, what you expected, and the approximate time of the failure.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / Reproduktionsschritte
      description: List the minimum steps needed to reproduce the problem.
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics package / Diagnosepaket
      description: Attach the ZIP generated by HA Analyst. Do not paste secret-bearing logs or configuration files instead.
      placeholder: Drag the HA Analyst diagnostics ZIP here.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report for credentials, tokens, license keys, internal URLs, names and other private household data.
          required: true
