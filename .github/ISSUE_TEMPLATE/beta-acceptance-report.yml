name: HA Analyst beta acceptance report / Beta-Abnahmebericht
description: Record fresh-install, update, recovery, runtime and diagnostics acceptance evidence. / Abnahme für Neuinstallation, Update, Recovery, Runtime und Diagnose dokumentieren.
title: "[Beta acceptance] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Testen / Thanks for testing HA Analyst.

        Dieses Formular ist für strukturierte Beta-Abnahmen gedacht. Bitte keine Home-Assistant-Tokens, Zigbee2MQTT-Tokens, Lizenzschlüssel, internen URLs oder persönliche Hausdaten einfügen.

        This form records structured beta acceptance evidence. Do not paste Home Assistant credentials, Zigbee2MQTT tokens, license keys, internal URLs, or private household data.

  - type: input
    id: analyst_version
    attributes:
      label: HA-Analyst-Version / Beta-Build · HA Analyst version / beta build
      placeholder: "1.0.17.x / B0.1.x"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home-Assistant-Core-Version · Home Assistant Core version
      placeholder: "2026.9.x"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architektur · Architecture
      options:
        - amd64
        - aarch64
    validations:
      required: true

  - type: dropdown
    id: scenario
    attributes:
      label: Abnahmeszenario · Acceptance scenario
      options:
        - Neuinstallation auf System ohne bisherigen HA Analyst / Fresh install on a system that never contained HA Analyst
        - Update von vorheriger unveränderlicher Beta / Update from previous immutable beta
        - Recovery / Rollback
        - Diagnose- und Supportpaket / Diagnostics and support package validation
        - Normaler Runtime-Regressionstest / Normal runtime regression
    validations:
      required: true

  - type: dropdown
    id: source_state
    attributes:
      label: Distributions-Ausgangszustand · Distribution source state
      description: War vor dem Test noch eine lokale addons/ha_analyst-Kopie vorhanden? / Was an old local addons/ha_analyst copy present before the test?
      options:
        - Keine lokale Kopie / No local copy present
        - Lokale Kopie vor Repository-Installation entfernt / Local copy was removed before repository install
        - Lokale Kopie noch vorhanden / Local copy is still present
        - Unbekannt / Unknown
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installations-/Update-Ergebnis · Installation / update result
      options:
        - PASS
        - FAIL
        - Nicht zutreffend / Not applicable
    validations:
      required: true

  - type: dropdown
    id: compile_observed
    attributes:
      label: Lokalen Native-Compile beobachtet? · Local Native compile observed?
      options:
        - Nein / No
        - Ja / Yes
        - Unbekannt / Unknown
        - Nicht zutreffend / Not applicable
    validations:
      required: true

  - type: dropdown
    id: restart_notice
    attributes:
      label: Bridge-Neustarthinweis · Bridge restart notice
      options:
        - Nicht angefordert / Not requested
        - Angefordert und ausgeführt / Requested and performed
        - Angefordert, nicht ausgeführt / Requested but not performed
        - Unsicher / Unsure
    validations:
      required: true

  - type: dropdown
    id: runtime_selftest
    attributes:
      label: Runtime-Selbsttest · Runtime self-test
      options:
        - PASS
        - FAIL
        - Konnte nicht ausgeführt werden / Could not run
        - Nicht ausgeführt / Not run
    validations:
      required: true

  - type: dropdown
    id: dashboard
    attributes:
      label: Dashboard-Readiness · Dashboard readiness
      options:
        - Bereit mit echten Daten / Ready with real data
        - Dashboard vorhanden, Daten/Karten unvollständig / Dashboard exists but data/cards are incomplete
        - Dashboard fehlt / Dashboard missing
        - Nicht geprüft / Not checked
    validations:
      required: true

  - type: dropdown
    id: config_survived
    attributes:
      label: Benutzerkonfiguration erhalten? · User configuration survived?
      options:
        - Ja / Yes
        - Nein / No
        - Nicht zutreffend / Not applicable
        - Nicht geprüft / Not checked
    validations:
      required: true

  - type: dropdown
    id: diagnostics
    attributes:
      label: Diagnose-ZIP · Diagnostics ZIP
      options:
        - Erfolgreich erzeugt / Generated successfully
        - Erzeugung fehlgeschlagen / Generation failed
        - Nicht getestet / Not tested
    validations:
      required: true

  - type: dropdown
    id: diagnostics_validator
    attributes:
      label: Datenschutzprüfung Diagnose · Diagnostics privacy validation
      description: Ergebnis der Maintainer-Prüfung des Diagnose-ZIPs, falls durchgeführt. / Result of the maintainer-side diagnostics ZIP validator or manual review, if performed.
      options:
        - PASS
        - FAIL
        - Maintainer-Prüfung offen / Pending maintainer review
        - Nicht zutreffend / Not applicable
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Beobachtungen · Notes
      description: Nur technische Beobachtungen zur Reproduktion/Abnahme eintragen; Hausnamen, interne URLs und Zugangsdaten vermeiden. / Record only technical observations needed to reproduce or assess the result; avoid household names, internal URLs and credentials.
    validations:
      required: false

  - type: textarea
    id: diagnostics_attachment
    attributes:
      label: Diagnosepaket · Diagnostics package
      description: HA-Analyst-Diagnose-ZIP anhängen, wenn Diagnoseprüfung Teil der Abnahme ist. / Attach the HA Analyst diagnostics ZIP when diagnostics validation is part of this acceptance report.
      placeholder: Diagnose-ZIP hier ablegen / Drag the diagnostics ZIP here.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutzprüfung · Privacy check
      options:
        - label: Ich habe den Bericht auf Zugangsdaten, Tokens, Lizenzschlüssel, interne URLs, Namen und andere private Hausdaten geprüft. / I checked this report for credentials, tokens, license keys, internal URLs, names and other private household data.
          required: true
